      message:
        type: string
      success:
        type: boolean
    type: object
  shortener.ShortensResponseData:
    properties:
      shortens:
        $ref: '#/definitions/shortener.PaginatedShortenResponse'
    type: object
  shortener.UpdateShortenAuthorizedRequest:
    properties:
      expires_at:
        $ref: '#/definitions/domain.NullableTime'
      original_url:
        type: string
    type: object
  user.HeartbeatRequest:
    properties:
      state:
        enum:
        - active
        - inactive
        type: string
    required:
    - state
    type: object
  user.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
      remember_me:
        type: boolean
    required:
    - email
    - password
    type: object
  user.LoginResponseData:
    properties:
      access_token:
        type: string
      user:
        $ref: '#/definitions/user.UserResponse'
    type: object
  user.LoginSwaggerResponse:
    properties:
      data:
        $ref: '#/definitions/user.LoginResponseData'
      message:
        type: string
      success:
        type: boolean
    type: object
  user.PaginatedUserResponse:
    properties:
      meta:
        $ref: '#/definitions/user.PaginationMeta'
      users:
        items:
          $ref: '#/definitions/user.UserResponse'
        type: array
    type: object
  user.PaginationMeta:
    properties:
      current_page:
        type: integer
      page_size:
        type: integer
      total_data:
        type: integer
      total_pages:
        type: integer
    type: object
  user.RefreshTokenResponseData:
    properties:
      access_token:
        type: string
    type: object
  user.RefreshTokenSwaggerResponse:
    properties:
      data:
        $ref: '#/definitions/user.RefreshTokenResponseData'
      message:
        type: string
      success:
        type: boolean
    type: object
  user.RegisterUserRequest:
    properties:
      confirm_password:
        type: string
      email:
        type: string
      name:
        type: string
      password:
        type: string
    required:
    - confirm_password
    - email
    - name
    - password
    type: object
  user.SessionsListResponseData:
    properties:
      session:
        items:
          $ref: '#/definitions/session.SessionResponse'
        type: array
    type: object
  user.SessionsListSwaggerResponse:
    properties:
      data:
        $ref: '#/definitions/user.SessionsListResponseData'
      message:
        type: string
      success:
        type: boolean
    type: object
  user.UpdateUserRequest:
    properties:
      email:
        type: string
      name:
        type: string
    type: object
  user.UserProfileResponseData:
    properties:
      user:
        $ref: '#/definitions/user.UserResponse'
    type: object
  user.UserProfileSwaggerResponse:
    properties:
      data:
        $ref: '#/definitions/user.UserProfileResponseData'
      message:
        type: string
      success:
        type: boolean
    type: object
  user.UserResponse:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
      remember_me:
        type: boolean
      role:
        type: string
    type: object
  user.UsersListResponseData:
    properties:
      users:
        $ref: '#/definitions/user.PaginatedUserResponse'
    type: object
  user.UsersListSwaggerResponse:
    properties:
      data:
        $ref: '#/definitions/user.UsersListResponseData'
      message:
        type: string
      success:
        type: boolean
    type: object
host: localhost:8080
info:
  contact: {}
  description: |2-

    ***IMPORTANT! READ THIS BEFORE TEST***

    When entering the token in Swagger Authorization:
    **"Bearer {YOUR-ACCESS-TOKEN}"**
    Make sure to include Bearer before your access token

    Always open **"DevTools (F12) -> Application -> Cookies"**
    For getting the latest Refresh Token and Session ID cookie in real time
    Works with HttpOnly cookies, which are protected from JavaScript access.
  title: URL Shortener Project API Service
  version: "1.0"
paths:
  /admin/shortens:
    get:
      description: Get All User Shortens Code Data from database with Paginated List
      parameters:
      - description: 'Page (Default: 1)'
