basePath: /v1/url-shortener
definitions:
  domain.NullableTime:
    properties:
      set:
        type: boolean
      value:
        type: string
    type: object
  pkg.Response:
    properties:
      data: {}
      error: {}
      message:
        type: string
      success:
        type: boolean
    type: object
  session.SessionResponse:
    properties:
      exp:
        type: string
      ia:
        type: boolean
      iat:
        type: string
      ic:
        type: boolean
      ip:
        type: string
      lat:
        type: string
      rt:
        type: string
      sid:
        type: string
      sub:
        type: string
      ua:
        type: string
    type: object
  shortener.CreateShortenAuthorizedRequest:
    properties:
      expires_at:
        type: string
      original_url:
        type: string
    required:
    - original_url
    type: object
  shortener.CreateShortenPublicRequest:
    properties:
      original_url:
        type: string
    required:
    - original_url
    type: object
  shortener.PaginatedShortenResponse:
    properties:
      meta:
        $ref: '#/definitions/shortener.PaginationMeta'
      users:
        items:
          $ref: '#/definitions/shortener.ShortenResponse'
        type: array
    type: object
  shortener.PaginationMeta:
    properties:
      current_page:
        type: integer
      page_size:
        type: integer
      total_data:
        type: integer
      total_pages:
        type: integer
    type: object
  shortener.ShortenResponse:
    properties:
      created_at:
        type: string
      expires_at:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      original_url:
        type: string
      owner:
        type: string
      short_code:
        type: string
    type: object
  shortener.ShortenerResponseData:
    properties:
      shorten:
        $ref: '#/definitions/shortener.ShortenResponse'
    type: object
  shortener.ShortenerSwaggerResponse:
    properties:
      data:
        $ref: '#/definitions/shortener.ShortenerResponseData'
      message:
        type: string
      success:
        type: boolean
    type: object
  shortener.ShortensListSwaggerResponse:
    properties:
      data:
