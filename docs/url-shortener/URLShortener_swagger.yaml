      - description: 'Limit (Default: 10)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Get Shortens Code Successfully
          schema:
            $ref: '#/definitions/shortener.ShortensListSwaggerResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/pkg.Response'
        "403":
          description: Access Denied
          schema:
            $ref: '#/definitions/pkg.Response'
        "404":
          description: Code Not Found
          schema:
            $ref: '#/definitions/pkg.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/pkg.Response'
      security:
      - BearerAuth: []
      summary: Get All User Shortens Code Paginated List (Admin)
      tags:
      - Admin
  /admin/shortens/{shid}:
